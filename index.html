<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abingdon GCSE Revision Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <style>
        .rag-red { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .rag-amber { background-color: #fef3c7; border-color: #f59e0b; color: #92400e; }
        .rag-green { background-color: #d1fae5; border-color: #10b981; color: #065f46; }
        .rag-none { background-color: #f3f4f6; border-color: #d1d5db; color: #374151; }
        
        .btn-red-active { background-color: #ef4444 !important; color: white !important; border-color: #dc2626 !important; }
        .btn-amber-active { background-color: #f59e0b !important; color: white !important; border-color: #d97706 !important; }
        .btn-green-active { background-color: #10b981 !important; color: white !important; border-color: #059669 !important; }
        
        .accordion-content { transition: max-height 0.2s ease-out; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen pb-16 transition-colors duration-200">

    <!-- Header Navigation -->
    <header class="bg-slate-900 dark:bg-slate-900 text-white shadow-lg sticky top-0 z-50 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg font-bold text-xl">AS</div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Abingdon School GCSE Revision Tracker</h1>
                    <p class="text-xs text-slate-400">7 Core Subjects Specification Checklist</p>
                </div>
            </div>

            <!-- Global Action Controls -->
            <div class="flex flex-wrap items-center gap-2 text-sm">
                <!-- Random Revision Generator Button -->
                <button onclick="pickRandomTopic()" class="bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white px-3 py-1.5 rounded font-medium shadow-sm flex items-center gap-1.5">
                    🎲 Pick Topic for Me
                </button>
                <!-- Dark Mode Toggle Button -->
                <button onclick="toggleDarkMode()" id="darkModeBtn" class="bg-slate-800 hover:bg-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700 px-3 py-1.5 rounded border border-slate-700 text-amber-400 dark:text-amber-300 font-medium flex items-center gap-1.5 transition">
                    <span id="darkIcon">🌙</span> <span id="darkText">Dark</span>
                </button>
                <button onclick="toggleAllAccordions(true)" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded border border-slate-700 text-slate-200">Expand All</button>
                <button onclick="toggleAllAccordions(false)" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded border border-slate-700 text-slate-200">Collapse All</button>
                <button onclick="exportData()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded font-medium shadow-sm">Export</button>
                <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded border border-slate-700 cursor-pointer">
                    Import
                    <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
                </label>
                <button onclick="resetData()" class="bg-red-900/40 hover:bg-red-900/60 text-red-200 px-3 py-1.5 rounded border border-red-800">Reset</button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">

        <!-- Progress Overview Dashboard -->
        <div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-5 mb-6 transition-colors">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                <div>
                    <h2 class="text-lg font-semibold text-slate-900 dark:text-white">Overall Revision Progress</h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400" id="overall-stats-text">0 / 0 subtopics mastered</p>
                </div>
                <div class="flex gap-4 text-xs font-semibold flex-wrap">
                    <span class="px-2.5 py-1 rounded bg-emerald-100 dark:bg-emerald-950 dark:text-emerald-300 text-emerald-800 border border-emerald-300 dark:border-emerald-800" id="stat-green">Green: 0 (0%)</span>
                    <span class="px-2.5 py-1 rounded bg-amber-100 dark:bg-amber-950 dark:text-amber-300 text-amber-800 border border-amber-300 dark:border-amber-800" id="stat-amber">Amber: 0 (0%)</span>
                    <span class="px-2.5 py-1 rounded bg-rose-100 dark:bg-rose-950 dark:text-rose-300 text-rose-800 border border-rose-300 dark:border-rose-800" id="stat-red">Red: 0 (0%)</span>
                    <span class="px-2.5 py-1 rounded bg-slate-100 dark:bg-slate-800 dark:text-slate-300 text-slate-700 border border-slate-300 dark:border-slate-700" id="stat-unrated">Unrated: 0 (100%)</span>
                </div>
            </div>
            <!-- Progress Bar -->
            <div class="w-full h-4 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden flex shadow-inner">
                <div id="bar-green" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%"></div>
                <div id="bar-amber" class="bg-amber-400 h-full transition-all duration-300" style="width: 0%"></div>
                <div id="bar-red" class="bg-rose-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Filter & Search Controls -->
        <div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-4 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between transition-colors">
            <!-- Search -->
            <div class="w-full md:w-1/3">
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Search topics, key terms or notes..." class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- Subject Select Dropdown -->
            <div class="w-full md:w-1/4">
                <select id="subjectFilter" onchange="applyFilters()" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                    <option value="ALL">All 7 Subjects</option>
                </select>
            </div>

            <!-- Multi-Select Filter Buttons -->
            <div class="flex items-center gap-1.5 w-full md:w-auto justify-start md:justify-end flex-wrap text-xs">
                <span class="text-slate-500 dark:text-slate-400 font-medium mr-1">Filters:</span>
                <button onclick="toggleMultiFilter('GREEN')" id="filter-GREEN" class="px-2.5 py-1.5 rounded font-medium border bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-300 dark:border-slate-700">Green</button>
                <button onclick="toggleMultiFilter('AMBER')" id="filter-AMBER" class="px-2.5 py-1.5 rounded font-medium border bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-300 dark:border-slate-700">Amber</button>
                <button onclick="toggleMultiFilter('RED')" id="filter-RED" class="px-2.5 py-1.5 rounded font-medium border bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-300 dark:border-slate-700">Red</button>
                <button onclick="toggleMultiFilter('NONE')" id="filter-NONE" class="px-2.5 py-1.5 rounded font-medium border bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-300 dark:border-slate-700">Unrated</button>
                <button onclick="toggleMultiFilter('STARRED')" id="filter-STARRED" class="px-2.5 py-1.5 rounded font-medium border bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-300 dark:border-slate-700">★ Starred</button>
            </div>
        </div>

        <!-- Subjects Container -->
        <div id="subjectsContainer" class="space-y-6"></div>

    </main>

    <!-- Random Topic Modal -->
    <div id="topicModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl text-center space-y-4">
            <div class="inline-flex p-3 bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 rounded-full text-2xl">
                🎯
            </div>
            <h3 class="text-lg font-bold text-slate-900 dark:text-white">Your Revision Focus</h3>
            <div id="modalSubject" class="text-xs font-semibold uppercase tracking-wider text-indigo-500"></div>
            <p id="modalTopicTitle" class="text-sm font-bold text-slate-700 dark:text-slate-300"></p>
            <div id="modalSubtopic" class="p-3 bg-slate-50 dark:bg-slate-800 rounded-xl text-sm font-medium text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700"></div>
            <div class="flex gap-3 pt-2">
                <button onclick="pickRandomTopic()" class="flex-1 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 py-2 rounded-lg text-sm font-semibold transition">Pick Another</button>
                <button onclick="closeModal()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-sm font-semibold transition">Got it!</button>
            </div>
        </div>
    </div>

        let appData = {};
        let activeFilters = new Set(); // Multi-select filter set

        function initDarkMode() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                updateDarkModeUI(true);
            } else {
                document.documentElement.classList.remove('dark');
                updateDarkModeUI(false);
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateDarkModeUI(isDark);
        }

        function updateDarkModeUI(isDark) {
            document.getElementById('darkIcon').textContent = isDark ? '☀️' : '🌙';
            document.getElementById('darkText').textContent = isDark ? 'Light' : 'Dark';
        }

        function initApp() {
            initDarkMode();

            const saved = localStorage.getItem('abingdon_gcse_tracker_v4');
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                } catch(e) {
                    appData = {};
                }
            }

            const filterSelect = document.getElementById('subjectFilter');
            SPEC_DATA.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub.id;
                opt.textContent = sub.name + ' (' + sub.examBoard + ')';
                filterSelect.appendChild(opt);
            });

            renderApp();
            calculateOverallStats();
        }

        function saveState() {
            localStorage.setItem('abingdon_gcse_tracker_v4', JSON.stringify(appData));
            calculateOverallStats();
            updateSubjectBars();
        }

        function getItemKey(subjectId, topicIndex, subIndex) {
            return `${subjectId}_t${topicIndex}_s${subIndex}`;
        }

        function getItemData(key) {
            return appData[key] || { status: 'NONE', starred: false, notes: '' };
        }

        function toggleStar(event, key) {
            event.stopPropagation();
            const curr = getItemData(key);
            const newStarred = !curr.starred;
            if (!appData[key]) appData[key] = { status: 'NONE', starred: false, notes: '' };
            appData[key].starred = newStarred;
            
            const starBtn = document.getElementById(`star_${key}`);
            if (starBtn) starBtn.textContent = newStarred ? '★' : '☆';
            
            saveState();
        }

        function setRAG(event, key, status) {
            event.stopPropagation();
            const curr = getItemData(key);
            const newStatus = curr.status === status ? 'NONE' : status;
            if (!appData[key]) appData[key] = { status: 'NONE', starred: false, notes: '' };
            appData[key].status = newStatus;

            ['RED', 'AMBER', 'GREEN'].forEach(st => {
                const btn = document.getElementById(`btn_${st}_${key}`);
                if (btn) {
                    if (st === newStatus) {
                        btn.className = `px-2.5 py-1 rounded text-xs font-semibold border btn-${st.toLowerCase()}-active`;
                    } else {
                        const colorClass = st === 'RED' ? 'text-rose-700 dark:text-rose-400 border-rose-300 dark:border-rose-900' :
                                           st === 'AMBER' ? 'text-amber-700 dark:text-amber-400 border-amber-300 dark:border-amber-900' :
                                           'text-emerald-700 dark:text-emerald-400 border-emerald-300 dark:border-emerald-900';
                        btn.className = `px-2.5 py-1 rounded text-xs font-semibold border bg-white dark:bg-slate-800 ${colorClass}`;
                    }
                }
            });

            saveState();
        }

        function updateNotes(event, key) {
            event.stopPropagation();
            const notes = event.target.value;
            if (!appData[key]) appData[key] = { status: 'NONE', starred: false, notes: '' };
            appData[key].notes = notes;
            saveState();
        }

        function toggleMultiFilter(filter) {
            const btn = document.getElementById(`filter-${filter}`);
            if (activeFilters.has(filter)) {
                activeFilters.delete(filter);
                btn.className = "px-2.5 py-1.5 rounded font-medium border bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-300 dark:border-slate-700";
            } else {
                activeFilters.add(filter);
                btn.className = "px-2.5 py-1.5 rounded font-medium border bg-indigo-600 text-white border-indigo-600";
            }
            renderApp();
        }

        function calculateOverallStats() {
            let total = 0;
            let green = 0, amber = 0, red = 0, unrated = 0;

            SPEC_DATA.forEach(subj => {
                subj.topics.forEach((topic, tIdx) => {
                    topic.subtopics.forEach((_, sIdx) => {
                        total++;
                        const key = getItemKey(subj.id, tIdx, sIdx);
                        const status = getItemData(key).status;
                        if (status === 'GREEN') green++;
                        else if (status === 'AMBER') amber++;
                        else if (status === 'RED') red++;
                        else unrated++;
                    });
                });
            });

            document.getElementById('overall-stats-text').textContent = `${green} of ${total} subtopics mastered`;
            
            const gPct = total ? ((green / total) * 100).toFixed(1) : 0;
            const aPct = total ? ((amber / total) * 100).toFixed(1) : 0;
            const rPct = total ? ((red / total) * 100).toFixed(1) : 0;
            const uPct = total ? ((unrated / total) * 100).toFixed(1) : 0;

            document.getElementById('stat-green').textContent = `Green: ${green} (${gPct}%)`;
            document.getElementById('stat-amber').textContent = `Amber: ${amber} (${aPct}%)`;
            document.getElementById('stat-red').textContent = `Red: ${red} (${rPct}%)`;
            document.getElementById('stat-unrated').textContent = `Unrated: ${unrated} (${uPct}%)`;

            document.getElementById('bar-green').style.width = `${gPct}%`;
            document.getElementById('bar-amber').style.width = `${aPct}%`;
            document.getElementById('bar-red').style.width = `${rPct}%`;
        }

        function updateSubjectBars() {
            SPEC_DATA.forEach(subj => {
                let subjTotal = 0, subjGreen = 0;
                subj.topics.forEach((t, tIdx) => {
                    t.subtopics.forEach((_, sIdx) => {
                        subjTotal++;
                        if (getItemData(getItemKey(subj.id, tIdx, sIdx)).status === 'GREEN') subjGreen++;
                    });
                });
                const subjPct = subjTotal ? Math.round((subjGreen / subjTotal) * 100) : 0;
                const barEl = document.getElementById(`subj_bar_${subj.id}`);
                const textEl = document.getElementById(`subj_text_${subj.id}`);
                if (barEl) barEl.style.width = `${subjPct}%`;
                if (textEl) textEl.textContent = `${subjPct}%`;
            });
        }

        function renderApp() {
            const container = document.getElementById('subjectsContainer');
            
            const expandedIds = new Set();
            document.querySelectorAll('.accordion-content:not(.hidden)').forEach(el => expandedIds.add(el.id));

            container.innerHTML = '';

            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const selectedSubj = document.getElementById('subjectFilter').value;

            SPEC_DATA.forEach(subj => {
                if (selectedSubj !== 'ALL' && subj.id !== selectedSubj) return;

                let subjTotal = 0, subjGreen = 0;
                subj.topics.forEach((t, tIdx) => {
                    t.subtopics.forEach((_, sIdx) => {
                        subjTotal++;
                        if (getItemData(getItemKey(subj.id, tIdx, sIdx)).status === 'GREEN') subjGreen++;
                    });
                });
                const subjPct = subjTotal ? Math.round((subjGreen / subjTotal) * 100) : 0;

                const subjCard = document.createElement('div');
                subjCard.className = "bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden transition-colors";

                let topicsHTML = '';

                subj.topics.forEach((topic, tIdx) => {
                    let subtopicsHTML = '';
                    let matchingSubtopicsCount = 0;

                    topic.subtopics.forEach((sub, sIdx) => {
                        const key = getItemKey(subj.id, tIdx, sIdx);
                        const item = getItemData(key);

                        // Multi-filter evaluation (matches if no filters active OR matches any active category condition)
                        if (activeFilters.size > 0) {
                            let matchesAny = false;
                            if (activeFilters.has('GREEN') && item.status === 'GREEN') matchesAny = true;
                            if (activeFilters.has('AMBER') && item.status === 'AMBER') matchesAny = true;
                            if (activeFilters.has('RED') && item.status === 'RED') matchesAny = true;
                            if (activeFilters.has('NONE') && item.status === 'NONE') matchesAny = true;
                            if (activeFilters.has('STARRED') && item.starred) matchesAny = true;
                            if (!matchesAny) return;
                        }

                        if (searchVal && !sub.toLowerCase().includes(searchVal) && !topic.title.toLowerCase().includes(searchVal) && !(item.notes && item.notes.toLowerCase().includes(searchVal))) {
                            return;
                        }

                        matchingSubtopicsCount++;

                        const isGreen = item.status === 'GREEN';
                        const isAmber = item.status === 'AMBER';
                        const isRed = item.status === 'RED';

                        subtopicsHTML += `
                            <div class="p-3 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-lg flex flex-col md:flex-row items-start md:items-center justify-between gap-3" onclick="event.stopPropagation()">
                                <div class="flex items-start gap-2.5 flex-1 w-full">
                                    <button id="star_${key}" onclick="toggleStar(event, '${key}')" class="text-lg mt-0.5 focus:outline-none transition-transform active:scale-125 text-amber-500" title="Star topic">
                                        ${item.starred ? '★' : '☆'}
                                    </button>
                                    <div class="flex-1 w-full">
                                        <p class="text-sm font-medium text-slate-800 dark:text-slate-200 leading-snug">${sub}</p>
                                        <input type="text"

                                            onchange="updateNotes(event, '${key}')" 
                                            onclick="event.stopPropagation()"

                                            class="mt-1.5 w-full text-xs px-2.5 py-1 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded focus:outline-none focus:ring-1 focus:ring-indigo-500 text-slate-600 dark:text-slate-300">
                                    </div>
                                </div>
                                
                                <div class="flex items-center gap-1 self-end md:self-center" onclick="event.stopPropagation()">
                                    <button id="btn_RED_${key}" onclick="setRAG(event, '${key}', 'RED')" class="px-2.5 py-1 rounded text-xs font-semibold border ${isRed ? 'btn-red-active' : 'bg-white dark:bg-slate-800 text-rose-700 dark:text-rose-400 border-rose-300 dark:border-rose-900 hover:bg-rose-50'}">Red</button>
                                    <button id="btn_AMBER_${key}" onclick="setRAG(event, '${key}', 'AMBER')" class="px-2.5 py-1 rounded text-xs font-semibold border ${isAmber ? 'btn-amber-active' : 'bg-white dark:bg-slate-800 text-amber-700 dark:text-amber-400 border-amber-300 dark:border-amber-900 hover:bg-amber-50'}">Amber</button>
                                    <button id="btn_GREEN_${key}" onclick="setRAG(event, '${key}', 'GREEN')" class="px-2.5 py-1 rounded text-xs font-semibold border ${isGreen ? 'btn-green-active' : 'bg-white dark:bg-slate-800 text-emerald-700 dark:text-emerald-400 border-emerald-300 dark:border-emerald-900 hover:bg-emerald-50'}">Green</button>

                            </div>
                        `;

                    if (matchingSubtopicsCount > 0) {

                if (topicsHTML) {
                    subjCard.innerHTML = `

            if (!container.hasChildNodes()) {
                container.innerHTML = `

        function pickRandomTopic() {
            // Collect unmastered subtopics (Red, Amber, or Unrated)
            let candidates = [];
            SPEC_DATA.forEach(subj => {
                subj.topics.forEach((topic, tIdx) => {
                    topic.subtopics.forEach((sub, sIdx) => {
                        const key = getItemKey(subj.id, tIdx, sIdx);
                        const status = getItemData(key).status;
                        if (status !== 'GREEN') {
                            candidates.push({
                                subject: `${subj.name} (${subj.examBoard})`,
                                topicTitle: topic.title,
                                subtopic: sub
                            });
                        }
                    });
                });
            });

            if (candidates.length === 0) {
                alert('Amazing job! You have mastered all subtopics. Reset or switch filters to pick more.');
                return;
            }

            const randomItem = candidates[Math.floor(Math.random() * candidates.length)];
            
            document.getElementById('modalSubject').textContent = randomItem.subject;
            document.getElementById('modalTopicTitle').textContent = randomItem.topicTitle;
            document.getElementById('modalSubtopic').textContent = randomItem.subtopic;
            document.getElementById('topicModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('topicModal').classList.add('hidden');
        }

        function toggleAccordion(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('hidden');
        }

        function toggleAllAccordions(open) {
            document.querySelectorAll('.accordion-content').forEach(el => {
                if (open) el.classList.remove('hidden');
                else el.classList.add('hidden');
            });
        }

        function applyFilters() {
            renderApp();
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Abingdon_GCSE_Revision_Data_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    appData = JSON.parse(e.target.result);
                    saveState();
                    renderApp();
                    alert('Revision data successfully imported!');
                } catch(err) {
                    alert('Invalid JSON file.');
                }
            };
            reader.readAsText(file);
        }

        function resetData() {
            if (confirm('Are you sure you want to reset all RAG ratings, stars, and notes?')) {
                appData = {};
                saveState();
                renderApp();
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
