<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abingdon GCSE Revision Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .rag-red { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .rag-amber { background-color: #fef3c7; border-color: #f59e0b; color: #92400e; }
        .rag-green { background-color: #d1fae5; border-color: #10b981; color: #065f46; }
        .rag-none { background-color: #f3f4f6; border-color: #d1d5db; color: #374151; }
        
        .btn-red-active { background-color: #ef4444; color: white; }
        .btn-amber-active { background-color: #f59e0b; color: white; }
        .btn-green-active { background-color: #10b981; color: white; }
        
        .accordion-content { transition: max-height 0.2s ease-out; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16">

    <!-- Header Navigation -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg font-bold text-xl">AS</div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Abingdon School GCSE Revision Tracker</h1>
                    <p class="text-xs text-slate-400">7 Core Subjects Specification Checklist</p>
                </div>
            </div>

            <!-- Global Action Controls -->
            <div class="flex flex-wrap items-center gap-2 text-sm">
                <button onclick="toggleAllAccordions(true)" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded border border-slate-700 text-slate-200">Expand All</button>
                <button onclick="toggleAllAccordions(false)" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded border border-slate-700 text-slate-200">Collapse All</button>
                <button onclick="exportData()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded font-medium shadow-sm">Export Data</button>
                <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded border border-slate-700 cursor-pointer">
                    Import
                    <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
                </label>
                <button onclick="resetData()" class="bg-red-900/40 hover:bg-red-900/60 text-red-200 px-3 py-1.5 rounded border border-red-800">Reset</button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">

        <!-- Progress Overview Dashboard -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                <div>
                    <h2 class="text-lg font-semibold text-slate-900">Overall Revision Progress</h2>
                    <p class="text-sm text-slate-500" id="overall-stats-text">0 / 0 subtopics mastered</p>
                </div>
                <div class="flex gap-4 text-xs font-semibold">
                    <span class="px-2.5 py-1 rounded bg-emerald-100 text-emerald-800 border border-emerald-300" id="stat-green">Green: 0 (0%)</span>
                    <span class="px-2.5 py-1 rounded bg-amber-100 text-amber-800 border border-amber-300" id="stat-amber">Amber: 0 (0%)</span>
                    <span class="px-2.5 py-1 rounded bg-rose-100 text-rose-800 border border-rose-300" id="stat-red">Red: 0 (0%)</span>
                    <span class="px-2.5 py-1 rounded bg-slate-100 text-slate-700 border border-slate-300" id="stat-unrated">Unrated: 0 (100%)</span>
                </div>
            </div>
            <!-- Progress Bar -->
            <div class="w-full h-4 bg-slate-100 rounded-full overflow-hidden flex shadow-inner">
                <div id="bar-green" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%"></div>
                <div id="bar-amber" class="bg-amber-400 h-full transition-all duration-300" style="width: 0%"></div>
                <div id="bar-red" class="bg-rose-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Filter & Search Controls -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
            <!-- Search -->
            <div class="w-full md:w-1/3">
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Search topics, key terms or notes..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- Subject Select Dropdown -->
            <div class="w-full md:w-1/4">
                <select id="subjectFilter" onchange="applyFilters()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                    <option value="ALL">All 7 Subjects</option>
                </select>
            </div>

            <!-- Filter Buttons -->
            <div class="flex items-center gap-1.5 w-full md:w-auto justify-start md:justify-end flex-wrap text-xs">
                <span class="text-slate-500 font-medium mr-1">Filter:</span>
                <button onclick="setRAGFilter('ALL')" id="filter-ALL" class="px-2.5 py-1.5 rounded font-medium border bg-slate-800 text-white border-slate-800">All</button>
                <button onclick="setRAGFilter('GREEN')" id="filter-GREEN" class="px-2.5 py-1.5 rounded font-medium border bg-white text-emerald-700 border-slate-300 hover:bg-emerald-50">Green</button>
                <button onclick="setRAGFilter('AMBER')" id="filter-AMBER" class="px-2.5 py-1.5 rounded font-medium border bg-white text-amber-700 border-slate-300 hover:bg-amber-50">Amber</button>
                <button onclick="setRAGFilter('RED')" id="filter-RED" class="px-2.5 py-1.5 rounded font-medium border bg-white text-rose-700 border-slate-300 hover:bg-rose-50">Red</button>
                <button onclick="setRAGFilter('STARRED')" id="filter-STARRED" class="px-2.5 py-1.5 rounded font-medium border bg-white text-amber-600 border-slate-300 hover:bg-amber-50">★ Starred</button>
            </div>
        </div>

        <!-- Subjects Container -->
        <div id="subjectsContainer" class="space-y-6"></div>

    </main>

                            'Trigonometry: Right-angled SOHCAHTOA, 3D Pythagoras & 3D Trigonometry',
                            'Sine & Cosine Rules: Non-right angled triangles & Ambiguous case of Sine rule',
                            'Area of Triangle: $\\frac{1}{2}ab\\sin C$',
                            'Vectors: Column vectors, geometric vector proofs & collinear points',
                            'Similar Shapes: Length, Area ($k^2$) and Volume ($k^3$) scale factors',
                            'Transformations: Translations, Reflections, Rotations & Enlargements with negative/fractional scale factors'
                        ]
                    },
                    {
                        title: '4. Statistics & Probability',
                        subtopics: [
                            'Cumulative Frequency graphs, median & interquartile range (IQR)',
                            'Histograms: Frequency density calculation with unequal class intervals',
                            'Probability tree diagrams, conditional probability $P(A|B)$ & Venn diagrams set notation'
                        ]
                    }
                ]
            },
            {
                id: 'admaths',
                name: 'Additional Maths',
                examBoard: 'OCR FSMQ (6993)',
                topics: [
                    {

                        subtopics: [
                            'Binomial Expansion $(a+b)^n$ for positive integer $n$',
                            'Polynomials: Factor theorem, Remainder theorem & solving cubic equations',
                            'Algebraic Proof of identities and inequalities'
                        ]
                    },
                    {
                        title: '2. Co-ordinate Geometry',
                        subtopics: [
                            'Straight lines: $y-y_1 = m(x-x_1)$, parallel/perpendicular gradient rules ($m_1 m_2 = -1$)',
                            'Circle equations $(x-a)^2 + (y-b)^2 = r^2$, line-circle intersections & tangents'
                        ]
                    },
                    {
                        title: '3. Trigonometry',
                        subtopics: [
                            'Identities: $\\tan\\theta = \\frac{\\sin\\theta}{\\cos\\theta}$, $\\sin^2\\theta + \\cos^2\\theta = 1$',
                            'Trigonometric equations in degrees and radians'
                        ]
                    },
                    {
                        title: '4. Calculus & Kinematics',
                        subtopics: [
                            'Differentiation: First principles, tangents/normals, stationary points & nature',
                            'Integration: Indefinite integrals, definite integrals & area under curves',
                            'Kinematics: Displacement $s(t)$, velocity $v(t)$, acceleration $a(t)$ calculus applications'
                        ]
                    },
                    {
                        title: '5. Numerical Methods',
                        subtopics: [
                            'Trapezium Rule for estimating area under curves',
                            'Newton-Raphson & Interval Halving root finding methods'
                        ]
                    }
                ]
            },
            {
                id: 'computerscience',
                name: 'Computer Science',
                examBoard: 'AQA (8525)',
                topics: [
                    {
                        title: '3.1 Fundamentals of Algorithms',
                        subtopics: [
                            'Algorithm representation: Flowcharts, Pseudocode & Trace tables',
                            'Efficiency: Time & space complexity principles',
                            'Searching algorithms: Linear search vs Binary search tracing',
                            'Sorting algorithms: Bubble sort vs Merge sort tracing'
                        ]
                    },
                    {
                        title: '3.2 Programming Concepts',
                        subtopics: [
                            'Variables, Constants, Assignment & Primitive Data Types',
                            'Control structures: Sequence, Selection (IF/SWITCH), Iteration (FOR/WHILE)',
                            'Arithmetic, Relational & Logical (AND, OR, NOT) operators',
                            'String manipulation: Length, substring, concatenation, char conversion',
                            'Data structures: 1D and 2D Arrays',
                            'Subroutines: Procedures, Functions, parameters, return values, local vs global scope',
                            'Text file handling: Open, read, write, close',
                            'Testing strategies: Syntax vs logic errors; boundary, normal & erroneous test data'
                        ]
                    },
                    {
                        title: '3.3 Data Representation',
                        subtopics: [
                            'Number systems: Binary, Hexadecimal, Denary conversions',
                            'Binary arithmetic: Addition, overflow errors & binary shifts',
                            'Character sets: ASCII vs Unicode',
                            'Bitmap images: Pixels, color depth, resolution & metadata',
                            'Digital sound: Sampling rate, bit depth & file size equation',
                            'Data compression: Lossy vs Lossless (Run Length Encoding)'
                        ]
                    },
                    {
                        title: '3.4 Computer Systems',
                        subtopics: [
                            'Hardware & Systems software vs Application software',
                            'CPU Architecture: Fetch-Decode-Execute cycle, ALU, Control Unit, Registers (PC, MAR, MDR, Accumulator)',
                            'CPU Performance: Clock speed, Cache size, Cores',
                            'Memory: RAM vs ROM & Virtual Memory',
                            'Secondary storage: Optical, Magnetic & Solid State technologies',
                            'Boolean logic: Truth tables for AND, OR, NOT, XOR, NAND, NOR logic gates'
                        ]
                    },
                    {
                        title: '3.5 Cyber Security & Networks',
                        subtopics: [
                            'Networks: Star vs Bus topologies, LAN vs WAN',
                            'Hardware: Routers, switches, NICs & transmission media',
                            'Protocols & Layers: TCP/IP, HTTP, HTTPS, FTP, POP3, IMAP, SMTP; 4-layer TCP/IP model',
                            'Cyber security threats: Phishing, Malware, SQL Injection, Brute Force',
                            'Defense mechanisms: Firewalls, Encryption, Anti-malware & Penetration testing'
                        ]
                    },
                    {
                        title: '3.6 Ethical, Legal & Environmental Impacts',
                        subtopics: [
                            'Ethical issues: AI, privacy, automation & digital divide',
                            'Legal frameworks: Data Protection Act 2018 / GDPR, Computer Misuse Act 1990, Copyright Act 1988',
                            'Environmental impact: E-waste & datacenter energy consumption'
                        ]
                    }
                ]
            }
        ];

        let appData = {};
        let activeRAGFilter = 'ALL';

        function initApp() {
            const saved = localStorage.getItem('abingdon_gcse_tracker_v3');
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                } catch(e) {
                    appData = {};
                }
            }

            const filterSelect = document.getElementById('subjectFilter');
            SPEC_DATA.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub.id;
                opt.textContent = sub.name + ' (' + sub.examBoard + ')';
                filterSelect.appendChild(opt);
            });

            renderApp();
            calculateOverallStats();
        }

        function saveState() {
            localStorage.setItem('abingdon_gcse_tracker_v3', JSON.stringify(appData));
            calculateOverallStats();
        }

        function getItemKey(subjectId, topicIndex, subIndex) {
            return `${subjectId}_t${topicIndex}_s${subIndex}`;
        }

        function getItemData(key) {
            return appData[key] || { status: 'NONE', starred: false, notes: '' };
        }

        function updateItemData(key, fields) {
            if (!appData[key]) {
                appData[key] = { status: 'NONE', starred: false, notes: '' };
            }
            Object.assign(appData[key], fields);
            saveState();
            renderApp();
        }

        function toggleStar(event, key) {
            event.stopPropagation();
            const curr = getItemData(key);
            updateItemData(key, { starred: !curr.starred });
        }

        function setRAG(event, key, status) {
            event.stopPropagation();
            const curr = getItemData(key);
            const newStatus = curr.status === status ? 'NONE' : status;
            updateItemData(key, { status: newStatus });
        }

        function updateNotes(event, key) {
            event.stopPropagation();
            const notes = event.target.value;
            if (!appData[key]) appData[key] = { status: 'NONE', starred: false, notes: '' };
            appData[key].notes = notes;
            saveState();
        }

        function setRAGFilter(filter) {
            activeRAGFilter = filter;
            ['ALL', 'GREEN', 'AMBER', 'RED', 'STARRED'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = "px-2.5 py-1.5 rounded font-medium border bg-slate-800 text-white border-slate-800";
                } else {
                    btn.className = "px-2.5 py-1.5 rounded font-medium border bg-white text-slate-700 border-slate-300 hover:bg-slate-50";
                }
            });
            renderApp();
        }

        function calculateOverallStats() {
            let total = 0;
            let green = 0, amber = 0, red = 0, unrated = 0;

            SPEC_DATA.forEach(subj => {
                subj.topics.forEach((topic, tIdx) => {
                    topic.subtopics.forEach((_, sIdx) => {
                        total++;
                        const key = getItemKey(subj.id, tIdx, sIdx);
                        const status = getItemData(key).status;
                        if (status === 'GREEN') green++;
                        else if (status === 'AMBER') amber++;
                        else if (status === 'RED') red++;
                        else unrated++;
                    });
                });
            });

            document.getElementById('overall-stats-text').textContent = `${green} of ${total} subtopics mastered`;
            
            const gPct = total ? ((green / total) * 100).toFixed(1) : 0;
            const aPct = total ? ((amber / total) * 100).toFixed(1) : 0;
            const rPct = total ? ((red / total) * 100).toFixed(1) : 0;
            const uPct = total ? ((unrated / total) * 100).toFixed(1) : 0;

            document.getElementById('stat-green').textContent = `Green: ${green} (${gPct}%)`;
            document.getElementById('stat-amber').textContent = `Amber: ${amber} (${aPct}%)`;
            document.getElementById('stat-red').textContent = `Red: ${red} (${rPct}%)`;
            document.getElementById('stat-unrated').textContent = `Unrated: ${unrated} (${uPct}%)`;

            document.getElementById('bar-green').style.width = `${gPct}%`;
            document.getElementById('bar-amber').style.width = `${aPct}%`;
            document.getElementById('bar-red').style.width = `${rPct}%`;
        }

        function renderApp() {
            const container = document.getElementById('subjectsContainer');
            container.innerHTML = '';

            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const selectedSubj = document.getElementById('subjectFilter').value;

            SPEC_DATA.forEach(subj => {
                if (selectedSubj !== 'ALL' && subj.id !== selectedSubj) return;

                let subjTotal = 0, subjGreen = 0;
                subj.topics.forEach((t, tIdx) => {
                    t.subtopics.forEach((_, sIdx) => {
                        subjTotal++;
                        if (getItemData(getItemKey(subj.id, tIdx, sIdx)).status === 'GREEN') subjGreen++;
                    });
                });
                const subjPct = subjTotal ? Math.round((subjGreen / subjTotal) * 100) : 0;

                const subjCard = document.createElement('div');
                subjCard.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden";

                let topicsHTML = '';

                subj.topics.forEach((topic, tIdx) => {
                    let subtopicsHTML = '';
                    let matchingSubtopicsCount = 0;

                    topic.subtopics.forEach((sub, sIdx) => {
                        const key = getItemKey(subj.id, tIdx, sIdx);
                        const item = getItemData(key);

                        if (activeRAGFilter === 'GREEN' && item.status !== 'GREEN') return;
                        if (activeRAGFilter === 'AMBER' && item.status !== 'AMBER') return;
                        if (activeRAGFilter === 'RED' && item.status !== 'RED') return;
                        if (activeRAGFilter === 'STARRED' && !item.starred) return;

                        if (searchVal && !sub.toLowerCase().includes(searchVal) && !topic.title.toLowerCase().includes(searchVal) && !(item.notes && item.notes.toLowerCase().includes(searchVal))) {
                            return;
                        }

                        matchingSubtopicsCount++;

                        const isGreen = item.status === 'GREEN';
                        const isAmber = item.status === 'AMBER';
                        const isRed = item.status === 'RED';

                        subtopicsHTML += `
                            <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg flex flex-col md:flex-row items-start md:items-center justify-between gap-3" onclick="event.stopPropagation()">
                                <div class="flex items-start gap-2.5 flex-1">
                                    <button onclick="toggleStar(event, '${key}')" class="text-lg mt-0.5 focus:outline-none transition-transform active:scale-125" title="Star topic">
                                        ${item.starred ? '★' : '☆'}
                                    </button>
                                    <div class="flex-1">
                                        <p class="text-sm font-medium text-slate-800 leading-snug">${sub}</p>
                                        <input type="text" 
                                            value="${item.notes || ''}" 
                                            onchange="updateNotes(event, '${key}')" 
                                            onclick="event.stopPropagation()"
                                            placeholder="Add notes / revision comments..." 
                                            class="mt-1.5 w-full text-xs px-2.5 py-1 bg-white border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-indigo-500 text-slate-600">
                                    </div>
                                </div>
                                
                                <div class="flex items-center gap-1 self-end md:self-center" onclick="event.stopPropagation()">
                                    <button onclick="setRAG(event, '${key}', 'RED')" class="px-2.5 py-1 rounded text-xs font-semibold border ${isRed ? 'btn-red-active' : 'bg-white text-rose-700 border-rose-300 hover:bg-rose-50'}">Red</button>
                                    <button onclick="setRAG(event, '${key}', 'AMBER')" class="px-2.5 py-1 rounded text-xs font-semibold border ${isAmber ? 'btn-amber-active' : 'bg-white text-amber-700 border-amber-300 hover:bg-amber-50'}">Amber</button>
                                    <button onclick="setRAG(event, '${key}', 'GREEN')" class="px-2.5 py-1 rounded text-xs font-semibold border ${isGreen ? 'btn-green-active' : 'bg-white text-emerald-700 border-emerald-300 hover:bg-emerald-50'}">Green</button>
                                </div>
                            </div>
                        `;
                    });

                    if (matchingSubtopicsCount > 0) {
                        const accordionId = `acc_${subj.id}_${tIdx}`;
                        topicsHTML += `
                            <div class="border-b border-slate-200 last:border-0">
                                <button onclick="toggleAccordion('${accordionId}')" class="w-full text-left px-5 py-3.5 bg-slate-100/70 hover:bg-slate-100 flex items-center justify-between font-medium text-slate-800 transition">
                                    <span>${topic.title}</span>
                                    <span class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-bold">${matchingSubtopicsCount} topics</span>
                                </button>
                                <div id="${accordionId}" class="accordion-content hidden p-4 space-y-2 bg-white">
                                    ${subtopicsHTML}
                                </div>
                            </div>
                        `;
                    }
                });

                if (topicsHTML) {
                    subjCard.innerHTML = `
                        <div class="bg-slate-900 text-white px-5 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                            <div>
                                <h3 class="text-lg font-bold">${subj.name}</h3>
                                <p class="text-xs text-slate-400">${subj.examBoard}</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="w-32 bg-slate-700 rounded-full h-2.5 overflow-hidden">
                                    <div class="bg-emerald-400 h-full" style="width: ${subjPct}%"></div>
                                </div>
                                <span class="text-xs font-semibold text-emerald-400 min-w-[35px] text-right">${subjPct}%</span>
                            </div>
                        </div>
                        <div>${topicsHTML}</div>
                    `;
                    container.appendChild(subjCard);
                }
            });

            if (!container.hasChildNodes()) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-xl border border-slate-200 text-slate-500">
                        No topics match your current filters or search term.
                    </div>
                `;
            }
        }

        function toggleAccordion(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('hidden');
        }

        function toggleAllAccordions(open) {
            document.querySelectorAll('.accordion-content').forEach(el => {
                if (open) el.classList.remove('hidden');
                else el.classList.add('hidden');
            });
        }

        function applyFilters() {
            renderApp();
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Abingdon_GCSE_Revision_Data_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    appData = JSON.parse(e.target.result);
                    saveState();
                    renderApp();
                    alert('Revision data successfully imported!');
                } catch(err) {
                    alert('Invalid JSON file.');
                }
            };
            reader.readAsText(file);
        }

        function resetData() {
            if (confirm('Are you sure you want to reset all RAG ratings, stars, and notes?')) {
                appData = {};
                saveState();
                renderApp();
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
